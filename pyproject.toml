[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfer"
version = "0.1.0"
description = "PDFer - 免费开源的 PDF 工具箱，图形界面，开箱即用"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "PDFer contributors" }]
keywords = ["pdf", "merge", "split", "desktop", "gui", "pyside6"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = [
    "pypdf>=5.1",
    "pikepdf>=9.0",
    "pypdfium2>=4.30,<5",
    "Pillow>=11.0",
    "PySide6>=6.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyinstaller>=6.10", "reportlab>=4.2"]

[project.scripts]
pdfer = "pdfer.__main__:main"

[project.urls]
Homepage = "https://github.com/yinhuaguang/PDFer"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
