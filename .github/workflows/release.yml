name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"

      - name: Run tests
        shell: pwsh
        run: pytest -q

      - name: Build single EXE
        shell: pwsh
        run: .\build.ps1 -Python (Get-Command python).Source

      - name: Run packaged self-test
        shell: pwsh
        run: .\dist\PDFer.exe --self-test

      - name: Verify checksum
        shell: pwsh
        run: |
          Get-Content .\dist\PDFer.exe.sha256.txt
          Get-FileHash .\dist\PDFer.exe -Algorithm SHA256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/PDFer.exe
            dist/PDFer.exe.sha256.txt
